components:
  schemas:
    UserRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
          minLength: 3
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 6
        displayName:
          type: string
      required:
      - email
      - password
      - username
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
    SongRatingRequest:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        rating:
          type: integer
          format: int32
          maximum: 10
          minimum: 1
      required:
      - rating
      - userId
    SongRatingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        username:
          type: string
        songId:
          type: integer
          format: int64
        rating:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
