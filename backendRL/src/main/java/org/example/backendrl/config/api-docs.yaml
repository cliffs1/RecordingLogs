openapi: 3.1.0
info:
  title: RecordingLogs API
  description: "Music rating and recommendation platform: genres, artists, albums,\
    \ songs, ratings, reviews, album lists, favorites and follows. Log in via POST\
    \ /api/auth/login and use the access token with the Authorize button."
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Reviews
  description: Album reviews written by users
- name: Genres
  description: Music genres
- name: Favorites
  description: Albums marked as favorite by users
- name: Charts
  description: "Top-rated albums and songs, ranked by average user rating"
- name: Artists
  description: Music artists
- name: Album ratings
  description: Ratings given to albums by users
- name: Songs
  description: Songs (tracks) of an album
- name: Song ratings
  description: Ratings given to songs by users
- name: Follows
  description: Following other users and their activity
- name: Authentication
  description: "Register, login, token refresh and logout"
- name: Lists
  description: Personal album lists
- name: Albums
  description: Albums of an artist
- name: Users
  description: Platform users
