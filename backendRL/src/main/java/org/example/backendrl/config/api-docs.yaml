openapi: 3.1.0
info:
  title: RecordingLogs API
  description: "Music rating and recommendation platform: genres, artists, albums,\
    \ songs, ratings, reviews, album lists, favorites and follows."
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Reviews
  description: Album reviews written by users
- name: Genres
  description: Music genres
- name: Favorites
  description: Albums marked as favorite by users
- name: Song ratings
  description: Ratings given to songs by users
- name: Follows
  description: Following other users and their activity
- name: Songs
  description: Songs (tracks)
- name: Artists
  description: Music artists
- name: Lists
  description: Personal album lists
- name: Album ratings
  description: Ratings given to albums by users
- name: Albums
  description: Music albums
- name: Users
  description: Platform users
